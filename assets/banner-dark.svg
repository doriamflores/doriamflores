<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img">
  <defs>
    <linearGradient id="cyberGradBanner_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="glowLine_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>
    <filter id="bannerGlow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="220" rx="14" fill="#08090e"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="#141829" stroke-width="1" opacity="0.65">
    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="200" x2="960" y2="200"/>

    <line x1="80" y1="0" x2="80" y2="220"/>
    <line x1="160" y1="0" x2="160" y2="220"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="320" y1="0" x2="320" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="560" y1="0" x2="560" y2="220"/>
    <line x1="640" y1="0" x2="640" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/>
    <line x1="800" y1="0" x2="800" y2="220"/>
    <line x1="880" y1="0" x2="880" y2="220"/>
  </g>

  <!-- Border Frame -->
  <rect x="2" y="2" width="956" height="216" rx="13" fill="none" stroke="url(#cyberGradBanner_dark)" stroke-width="1.8"/>

  <!-- Top Cyber Status Bar -->
  <text x="35" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">NODE_ID: LIMA_PE</text>
  <text x="160" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f3ff">// ARCHITECTURE: EVENT_DRIVEN</text>
  <text x="780" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff9f" font-weight="700">SYS_STATUS: ONLINE ⚡</text>

  <!-- Glowing Horizontal Divider -->
  <line x1="20" y1="38" x2="940" y2="38" stroke="url(#glowLine_dark)" stroke-width="1.5"/>

  <!-- Main Hero Title -->
  <g transform="translate(40, 98)">
    <!-- Brand Logo Icon -->
    <rect x="0" y="-36" width="46" height="46" rx="8" fill="#111422" stroke="#00f3ff" stroke-width="1.5"/>
    <text x="23" y="-8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" fill="#00f3ff">D</text>
    
    <!-- Title Text -->
    <text x="64" y="-8" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      DORIAM FLORES <tspan fill="#ff007f">.DEV</tspan>
    </text>

    <!-- Subtitle Role -->
    <text x="66" y="22" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#00f3ff" letter-spacing="1">
      ⚡ SENIOR BACKEND ARCHITECT &amp; AI INTEGRATOR
    </text>
  </g>

  <!-- Floating Cyber Badges / Stack Tags -->
  <g transform="translate(40, 160)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="135" height="28" rx="6" fill="#111422" stroke="#00f3ff" stroke-width="1"/>
    <text x="67" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f3ff" font-weight="600">⚡ MICROSERVICES</text>

    <!-- Tag 2 -->
    <rect x="145" y="0" width="130" height="28" rx="6" fill="#111422" stroke="#ff007f" stroke-width="1"/>
    <text x="210" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff007f" font-weight="600">🤖 AI &amp; LLM AGENTS</text>

    <!-- Tag 3 -->
    <rect x="285" y="0" width="115" height="28" rx="6" fill="#111422" stroke="#ffe600" stroke-width="1"/>
    <text x="342" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffe600" font-weight="600">☁ AWS CLOUD</text>

    <!-- Tag 4 -->
    <rect x="410" y="0" width="145" height="28" rx="6" fill="#111422" stroke="#00ff9f" stroke-width="1"/>
    <text x="482" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff9f" font-weight="600">🚀 HIGH CONCURRENCY</text>

    <!-- Tag 5 -->
    <rect x="565" y="0" width="140" height="28" rx="6" fill="#111422" stroke="#b026ff" stroke-width="1"/>
    <text x="635" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#b026ff" font-weight="600">📦 EVENT-DRIVEN</text>
  </g>

  <!-- Right Decorative Hexagon & Telemetry -->
  <g transform="translate(810, 60)" opacity="0.9">
    <polygon points="50,0 100,28 100,85 50,114 0,85 0,28" fill="none" stroke="#00f3ff" stroke-width="1.5"/>
    <polygon points="50,15 85,35 85,78 50,98 15,78 15,35" fill="#111422" stroke="#ff007f" stroke-width="1"/>
    <text x="50" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00ff9f">200 OK</text>
  </g>
</svg>